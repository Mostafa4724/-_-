<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lessons · EduPlatform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/lessons.css">
</head>
<body data-page="lessons" data-lang="en">
  <div class="app">
    <aside class="sidebar"></aside>
    <main class="main">
      <header class="topbar"></header>
      <div class="page" id="pageContent">
        <div class="page-head">
          <div>
            <div class="page-head-title" data-i18n="lessons_title">Lessons Management</div>
            <div class="page-head-sub" data-i18n="lessons_sub">Create and manage educational content</div>
          </div>
          <div class="page-head-actions">
            <div class="view-toggle">
              <button class="icon-btn active" id="viewGrid" title="Grid"><i data-lucide="layout-grid" class="icon"></i></button>
              <button class="icon-btn" id="viewTable" title="Table"><i data-lucide="list" class="icon"></i></button>
            </div>
            <button class="btn btn-primary btn-sm" id="addLessonBtn">
              <i data-lucide="plus" class="icon"></i>
              <span data-i18n="add_lesson">Add Lesson</span>
            </button>
          </div>
        </div>

        <!-- Mini stats -->
        <div class="grid grid-4" style="margin-bottom: 20px;">
          <div class="stat-card" style="--stat-color:#7C3AED;--stat-tint:var(--tint-accent)">
            <div class="stat-top"><div class="stat-icon"><i data-lucide="book-open" class="icon"></i></div><span class="stat-trend up"><i data-lucide="trending-up" class="icon"></i>+5.1%</span></div>
            <div class="stat-value" id="lstat-total">18</div>
            <div class="stat-label" data-i18n="total_lessons">Total Lessons</div>
          </div>
          <div class="stat-card" style="--stat-color:#10B981;--stat-tint:var(--tint-success)">
            <div class="stat-top"><div class="stat-icon"><i data-lucide="check-circle" class="icon"></i></div></div>
            <div class="stat-value" id="lstat-published">15</div>
            <div class="stat-label" data-i18n="published">Published</div>
          </div>
          <div class="stat-card" style="--stat-color:#F59E0B;--stat-tint:var(--tint-warning)">
            <div class="stat-top"><div class="stat-icon"><i data-lucide="edit-3" class="icon"></i></div></div>
            <div class="stat-value" id="lstat-draft">3</div>
            <div class="stat-label" data-i18n="draft">Draft</div>
          </div>
          <div class="stat-card" style="--stat-color:#2563EB;--stat-tint:var(--tint-secondary)">
            <div class="stat-top"><div class="stat-icon"><i data-lucide="eye" class="icon"></i></div><span class="stat-trend up"><i data-lucide="trending-up" class="icon"></i>+18%</span></div>
            <div class="stat-value" id="lstat-views">12.4K</div>
            <div class="stat-label" data-i18n="lesson_views">Lesson Views</div>
          </div>
        </div>

        <!-- Filters -->
        <div class="card" style="margin-bottom:20px">
          <div class="card-body" style="padding: 14px 20px;">
            <div class="filters-bar" style="margin-bottom:0">
              <div class="search-wrap search-inline">
                <i data-lucide="search" class="icon"></i>
                <input type="text" class="form-control search-input" id="filterSearch" data-i18n-ph="search_placeholder" placeholder="Search lessons...">
              </div>
              <select class="form-control" id="filterSubject" style="height:38px">
                <option value="" data-i18n="subject">Subject</option>
              </select>
              <select class="form-control" id="filterGrade" style="height:38px">
                <option value="" data-i18n="grade">Grade</option>
              </select>
              <select class="form-control" id="filterStatus" style="height:38px">
                <option value="" data-i18n="status">Status</option>
                <option value="published" data-i18n="published">Published</option>
                <option value="draft" data-i18n="draft">Draft</option>
              </select>
              <select class="form-control" id="sortBy" style="height:38px">
                <option value="recent" data-i18n="date">Recent</option>
                <option value="views" data-i18n="lesson_views">Most Viewed</option>
                <option value="title">Title A-Z</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Lessons container -->
        <div id="lessonsContainer"></div>
      </div>
    </main>
  </div>

  <!-- Add/Edit Lesson Modal -->
  <div class="modal-overlay" id="lessonModal">
    <div class="modal modal-xl">
      <div class="modal-head">
        <div>
          <div class="modal-title" id="lessonModalTitle" data-i18n="add_lesson">Add Lesson</div>
          <div class="modal-sub">Fill in lesson details and upload materials</div>
        </div>
        <button class="icon-btn" onclick="closeModal('lessonModal')"><i data-lucide="x" class="icon"></i></button>
      </div>
      <div class="modal-body">
        <form id="lessonForm" onsubmit="return false">
          <input type="hidden" id="lessonIdField">
          <div class="form-grid">
            <div class="form-group" style="grid-column: span 2">
              <label class="form-label" data-i18n="lesson_title">Lesson Title <span class="req">*</span></label>
              <input type="text" class="form-control" id="l_title" required>
            </div>
            <div class="form-group" style="grid-column: span 2">
              <label class="form-label" data-i18n="description">Description</label>
              <textarea class="form-control" id="l_desc" rows="3"></textarea>
            </div>
            <div class="form-group">
              <label class="form-label" data-i18n="subject">Subject <span class="req">*</span></label>
              <select class="form-control" id="l_subject"></select>
            </div>
            <div class="form-group">
              <label class="form-label" data-i18n="grade">Grade <span class="req">*</span></label>
              <select class="form-control" id="l_grade"></select>
            </div>
            <div class="form-group">
              <label class="form-label" data-i18n="video_url">Video URL</label>
              <input type="url" class="form-control" id="l_video" placeholder="https://...">
            </div>
            <div class="form-group">
              <label class="form-label" data-i18n="publication_status">Status</label>
              <select class="form-control" id="l_status">
                <option value="draft" data-i18n="draft">Draft</option>
                <option value="published" data-i18n="published">Published</option>
              </select>
            </div>
            <div class="form-group" style="grid-column: span 2">
              <label class="form-label" data-i18n="thumbnail">Thumbnail</label>
              <div class="file-drop" id="thumbDrop">
                <i data-lucide="image" class="icon"></i>
                <div><strong>Click to upload</strong> or drag and drop</div>
                <div class="text-xs text-3 mt-2">PNG, JPG up to 2MB</div>
              </div>
              <input type="file" id="thumbInput" accept="image/*" hidden>
            </div>
            <div class="form-group" style="grid-column: span 2">
              <label class="form-label" data-i18n="attached_files">Attached Files</label>
              <div class="file-drop" id="filesDrop">
                <i data-lucide="upload-cloud" class="icon"></i>
                <div><strong>Upload PDF</strong> or educational materials</div>
                <div class="text-xs text-3 mt-2">PDF, DOCX, PPTX up to 10MB</div>
              </div>
              <input type="file" id="filesInput" accept=".pdf,.docx,.pptx" multiple hidden>
              <div id="filesList" class="mt-2"></div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-foot">
        <button class="btn btn-secondary" onclick="closeModal('lessonModal')" data-i18n="cancel">Cancel</button>
        <button class="btn btn-primary" id="saveLessonBtn" data-i18n="save">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- Lesson Detail Modal -->
  <div class="modal-overlay" id="lessonDetailModal">
    <div class="modal modal-lg">
      <div class="modal-head">
        <div><div class="modal-title" id="detailTitle"></div><div class="modal-sub" id="detailSub"></div></div>
        <button class="icon-btn" onclick="closeModal('lessonDetailModal')"><i data-lucide="x" class="icon"></i></button>
      </div>
      <div class="modal-body" id="detailBody"></div>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="js/translations.js"></script>
  <script src="js/data.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/lessons.js"></script>
</body>
</html>
